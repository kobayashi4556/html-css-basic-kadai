<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SAMURAIニュース</title>
</head>
<body>

    <header>
        <h1>SAMURAIニュース</h1>
        <nav>
            <a href="#">ホーム</a>
            <a href="#">社会</a>
            <a href="#">経済</a>
            <a href="#">スポーツ</a>
            <a href="#">テクノロジー</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>社会</h2>
            <h3>和菓子店も「トリックオアトリート！」</h3>
            <p>
                日本でも年々人気の高まるハロウィン。<br>
                今年は大手和菓子店5社がハロウィン向けの和菓子セットを共同開発しました。
            </p>
            <audio controls src="audio.mp3"></audio>
        </section>

        <br>

        <section>
            <h2>私のおすすめ和菓子アンケートフォーム</h2>
            <form>
                <label>氏名</label>
                <input type="text" placeholder="名前を入力してください"><br><br>

                <label>年代</label>
                <select>
                    <option>10代以下</option>
                    <option>20代</option>
                    <option>30代</option>
                    <option>40代以上</option>
                </select><br><br>

                <label>男性</label><input type="radio" name="gender" value="male">
                <label>女性</label><input type="radio" name="gender" value="female">
                <label>その他</label><input type="radio" name="gender" value="other"><br><br>

                <label>おすすめ和菓子の名称</label>
                <input type="text" placeholder="例：みたらし団子"><br><br>

                <label>おすすめする理由</label><br>
                <textarea rows="4" cols="40"></textarea><br>

                <label>個人情報保護方針に同意する</label>
                <input type="checkbox"><br><br>

                <input type="submit" value="送信">
                <input type="reset" value="リセット">
            </form>
        </section>

        <section>
            <h2>テクノロジー</h2>
            <h3>SAMURAIが新しい動画をリリース</h3>
            <p>
                SAMURAI公式YouTubeで新しい動画がリリースされました。<br>
                動画の内容はHTML/CSSの解説です。
            </p>
        </section>
    </main>

    <footer>
        <p>&copy;SAMURAIニュース</p>
    </footer>
